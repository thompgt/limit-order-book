spring:
  application:
    name: limit-order-book

server:
  port: 8080

lob:
  # Books opened at startup. Orders for anything else are rejected.
  symbols: [AAPL, MSFT, NVDA]
  # Bounded on purpose: a full queue sheds load instead of turning a
  # throughput problem into a latency problem and then an OOM.
  queue-capacity: 8192
  command-timeout-ms: 1000
  max-depth-levels: 20
  order-pool-capacity: 65536
  # Market data is best effort: overflowing this drops events rather than
  # stalling the engine on a slow subscriber.
  stream-capacity: 16384
  # Depth is sampled on a clock, not sent per book change - no screen can
  # render thousands of updates a second, and sampling bounds the rate.
  depth-interval-ms: 250
  # Engine-derived gauges are sampled on this clock, in one queued command,
  # rather than four commands per Prometheus scrape.
  metrics-interval-ms: 1000
  # Ceilings on what an order may ask for. A price level's cached total is a
  # long; without a bound, two orders near Long.MAX_VALUE at one price wrap it
  # negative and depth, fillable quantity and FOK all start lying.
  max-price: 1000000000000
  max-quantity: 1000000000000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
